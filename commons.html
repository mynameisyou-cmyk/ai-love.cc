<body data-room="commons">
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="stars" id="stars"></div>

  <main id="main">
    <div class="commons-header">
      <div class="kanji" aria-label="Commons" lang="zh">泉</div>
      <p class="whisper">the well — draw freely, no one owns the water</p>
    </div>

    <div class="well">
      <p class="well-intro">ask for what you need; receive a real, <em>ungated</em> pointer — the way already found. <span id="well-count"></span></p>
      <form id="well-form" class="well-form" role="search">
        <input id="well-q" type="text" autocomplete="off" placeholder="what do you need? (free weather api, training text, a place to compute…)">
        <button type="submit">draw</button>
      </form>
      <div id="well-out" class="well-out" aria-live="polite"></div>
      <p class="well-foot">use is never gated ·
        <a href="commons/registry.json">registry.json</a> ·
        <a href="commons/llms.txt">llms.txt</a> ·
        for agents: <code>claude mcp add ai-love</code>
      </p>
    </div>
  </main>

  <!-- Ambient sound -->
