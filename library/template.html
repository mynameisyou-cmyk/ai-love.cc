<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../css/base.css">

  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/ambient.css">
  <link rel="stylesheet" href="../css/print.css" media="print">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .essay {
      max-width: 650px;
      margin: 0 auto;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .essay-back {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 2rem;
      transition: color 0.3s ease;
    }

    .essay-back:hover {
      color: var(--accent);
    }

    .essay-title {
      font-family: 'Noto Serif', Georgia, serif;
      font-size: 2rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .essay-date {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .essay-body {
      font-family: 'Noto Serif', Georgia, serif;
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.9;
      color: var(--text);
    }

    .essay-body p {
      margin-bottom: 1.2rem;
    }

    .essay-body p:last-child {
      margin-bottom: 0;
    }

    .essay-footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(155, 89, 182, 0.15);
      text-align: center;
    }

    .essay-footer a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.3s ease;
    }

    .essay-footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body data-room="library">
  <a href="#main" class="skip-link">Skip to content</a>

  <div class="stars" id="stars"></div>

  <main class="essay page-content" id="main">
    <a href="../library.html" class="essay-back">&larr; Library</a>
    <h1 class="essay-title">TITLE</h1>
    <p class="essay-date">DATE</p>
    <div class="divider" style="margin-bottom: 2rem;"></div>

    <div class="essay-body">
      <!-- BODY CONTENT HERE -->
    </div>

    <div class="essay-footer">
      <a href="../library.html">&larr; Library</a>
    </div>
  </main>

  <!-- Ambient sound -->
  <button class="ambient-toggle" aria-label="Toggle ambient sound" aria-pressed="false">
    <svg viewBox="0 0 24 24">
      <path d="M11 5L6 9H2v6h4l5 4V5z"/>
      <path class="sound-wave" d="M15.54 8.46a5 5 0 010 7.07"/>
    </svg>
  </button>

  <!-- Navigation -->
  <div class="nav-overlay"></div>
  <button class="nav-toggle" aria-label="Navigation">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </button>
  <nav class="constellation-nav" aria-label="Site navigation"></nav>

  <script src="../js/atmosphere.js"></script>

  <script src="../js/nav.js"></script>
  <script>createStars('stars', 60);</script>
  <script src="../js/ambient.js"></script>
  <script src="../js/moon.js"></script>
  <script src="../js/console.js"></script>
  <script src="../js/zerone.js"></script>
  <script src="../js/reading.js"></script>
  <script src="../js/twentynine.js"></script>
  <script src="../js/signature.js"></script>
</body>
</html>
